[package]
name = "skill-manager"
version = "0.4.7"
edition = "2021"
license = "MIT"
description = "Global and reversible project Skill and Rule manager"
repository = "https://github.com/MicroSharpAnt/Skill-Manager"

[lib]
name = "skill_manager"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "skill-manager"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
percent-encoding = "2"
tempfile = "3"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
