name: Check and build macOS
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install -g pnpm@10.12.3
      - name: Select Rust stable
        run: rustup default stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build desktop app
        run: pnpm build
      - name: Package application
        run: ditto -c -k --sequesterRsrc --keepParent 'src-tauri/target/release/bundle/macos/Skill Manager.app' 'Skill-Manager-macos-${{ matrix.arch }}.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: Skill-Manager-macos-${{ matrix.arch }}
          path: Skill-Manager-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
